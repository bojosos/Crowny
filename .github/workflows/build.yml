name: Build

env:
  MONO_VERSION: "6.12.0.206"
  VULKAN_SDK_VERSION: "1.4.357.0"

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check runtime asset API boundaries
        run: python Scripts/check_asset_api.py --self-test

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xorg-dev libgl1-mesa-dev libx11-dev libxcursor-dev uuid-dev \
            libvorbis-dev libopenal-dev libgtk-3-dev libglib2.0-dev \
            libvulkan-dev vulkan-utility-libraries-dev spirv-tools \
            libspirv-cross-c-shared-dev libshaderc-dev \
            mono-devel clang
          if ! command -v csc >/dev/null 2>&1; then
            sudo ln -s "$(command -v mono-csc)" /usr/local/bin/csc
          fi
          mkdir -p .deps/VulkanSDK/Include/vma
          wget -O .deps/VulkanSDK/Include/vma/vk_mem_alloc.h https://raw.githubusercontent.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator/v3.4.0/include/vk_mem_alloc.h

      - name: Generate projects
        run: |
          chmod +x Scripts/setup-physics.sh
          ./Scripts/setup-physics.sh Release avx2
          chmod +x 3rdparty/premake/bin/premake5
          ./3rdparty/premake/bin/premake5 gmake2 --simd=avx2 --with-nodes

      - name: Build Crowny
        run: make Crowny -j$(nproc) config=release_linux64 CXX=clang++

      - name: Build Crowny-Editor
        run: make Crowny-Editor -j$(nproc) config=release_linux64 CXX=clang++

      - name: Build Crowny-Sharp
        run: |
          cd Crowny-Sharp
          find ./Source -type f -name "*.cs" -print0 | xargs -0 csc -debug:portable -optimize- -target:library -out:CrownySharp.dll

      - name: Build Crowny-Sandbox
        run: |
          cd Crowny-Sandbox
          find ./Source -type f -name "*.cs" -print0 | xargs -0 csc -debug:portable -optimize- -lib:../Crowny-Sharp -reference:CrownySharp.dll -target:library -out:GameAssembly.dll

      - name: Build Crowny-Tests
        run: make Crowny-Tests -j$(nproc) config=release_linux64 CXX=clang++

      - name: Run Tests
        run: ./bin/Release-linux-x86_64/Crowny-Tests/Crowny-Tests

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check runtime asset API boundaries
        run: python Scripts/check_asset_api.py --self-test

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install Mono
        shell: powershell
        run: |
          choco install mono --version $env:MONO_VERSION --yes --no-progress
          $chocoExitCode = $LASTEXITCODE
          if ($chocoExitCode -notin @(0, 1641, 3010)) { exit $chocoExitCode }
          $monoRoot = Join-Path $env:ProgramFiles "Mono"
          $requiredMonoFiles = @(
            (Join-Path $monoRoot "include\mono-2.0\mono\jit\jit.h"),
            (Join-Path $monoRoot "lib\mono-2.0-sgen.lib"),
            (Join-Path $monoRoot "bin\mono-2.0-sgen.dll")
          )
          foreach ($requiredFile in $requiredMonoFiles) {
            if (-not (Test-Path -LiteralPath $requiredFile)) { throw "Mono installation is missing $requiredFile" }
          }
          "CROWNY_MONO_ROOT=$monoRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Vulkan SDK
        run: |
          $ver = $env:VULKAN_SDK_VERSION
          $installer = "vulkansdk-windows-X64-$ver.exe"
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/$ver/windows/$installer" -OutFile $installer
          Start-Process -FilePath ".\$installer" -ArgumentList "--accept-licenses --default-answer --confirm-command install" -Wait
          $sdkPath = "C:\VulkanSDK\$ver"
          echo "VULKAN_SDK=$sdkPath" >> $env:GITHUB_ENV
          echo "$sdkPath\Bin" >> $env:GITHUB_PATH
        shell: powershell

      - name: Setup CI Environment
        run: |
          mkdir -p .deps/VulkanSDK/Include/vma
          Invoke-WebRequest -Uri https://raw.githubusercontent.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator/v3.4.0/include/vk_mem_alloc.h -OutFile .deps/VulkanSDK/Include/vma/vk_mem_alloc.h
        shell: powershell

      - name: Generate projects
        shell: powershell
        run: |
          $env:CROWNY_OPENAL_ROOT = Join-Path $PWD ".deps\openal"
          "CROWNY_OPENAL_ROOT=$env:CROWNY_OPENAL_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & Scripts/setup-openal.ps1 -Configuration Release -Simd AVX2
          & Scripts/setup-physics.ps1 -Configuration Release -Simd AVX2
          & Scripts/setup-spirv-cross.ps1 -Configuration Release -VulkanVersion $env:VULKAN_SDK_VERSION -Simd AVX2
          & 3rdparty/premake/bin/premake5.exe vs2022 --with-nodes --simd=avx2

      - name: Build
        run: |
          msbuild Crowny.sln /p:Configuration=Release /p:Platform=Win64 /m

      - name: Run Tests
        shell: bash
        run: |
          export PATH=$PATH:$PWD/.deps/openal/bin
          ./bin/Release-windows-x86_64/Crowny-Tests/Crowny-Tests.exe
