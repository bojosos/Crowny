name: Build

env:
  MONO_VERSION: "6.12.0.206"
  VULKAN_SDK_VERSION: "1.4.357.0"

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check generated interop and runtime asset API boundaries
        run: |
          python Scripts/managed/generate_managed_interop.py --check
          python Scripts/check_asset_api.py --self-test

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xorg-dev libgl1-mesa-dev libx11-dev libxcursor-dev uuid-dev \
            libvorbis-dev libopenal-dev libgtk-3-dev libglib2.0-dev \
            libvulkan-dev vulkan-utility-libraries-dev spirv-tools \
            libspirv-cross-c-shared-dev libshaderc-dev \
            mono-devel clang
          if ! command -v csc >/dev/null 2>&1; then
            sudo ln -s "$(command -v mono-csc)" /usr/local/bin/csc
          fi
          # mono-csc 6.x rejects MethodImplOptions.AggressiveOptimization.
          fastnoise_path="Crowny/Dependencies/FastNoiseLite/CSharp/FastNoiseLite.cs"
          sed -i 's|private const short OPTIMISE = 512; // MethodImplOptions.AggressiveOptimization;|private const short OPTIMISE = 0; // Unsupported by legacy Mono compilers.|' "$fastnoise_path"
          grep -Fq 'private const short OPTIMISE = 0; // Unsupported by legacy Mono compilers.' "$fastnoise_path"
          mkdir -p .deps/VulkanSDK/Include/vma
          wget -O .deps/VulkanSDK/Include/vma/vk_mem_alloc.h https://raw.githubusercontent.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator/v3.4.0/include/vk_mem_alloc.h

      - name: Generate projects
        run: |
          ./Scripts/crowny deps physics --configuration Release --simd avx2
          ./Scripts/crowny gen --simd avx2

      - name: Build Crowny
        run: make Crowny -j$(nproc) config=release_linux64 CXX=clang++

      - name: Build Crowny-Editor
        run: make Crowny-Editor -j$(nproc) config=release_linux64 CXX=clang++

      - name: Build Crowny-Sharp
        run: |
          cd Crowny-Sharp
          find ./Source -type f -name "*.cs" -print0 | xargs -0 csc -unsafe -langversion:latest -define:CROWNY_MONO -debug:portable -optimize- -target:library -out:CrownySharp.dll "../Crowny/Dependencies/FastNoiseLite/CSharp/FastNoiseLite.cs"

      - name: Build Crowny-Sandbox
        run: |
          cd Crowny-Sandbox
          find ./Source -type f -name "*.cs" -print0 | xargs -0 csc -langversion:latest -debug:portable -optimize- -reference:../Crowny-Sharp/CrownySharp.dll -target:library -out:GameAssembly.dll

      - name: Build Crowny-Tests
        run: make Crowny-Tests -j$(nproc) config=release_linux64 CXX=clang++

      - name: Run Tests
        timeout-minutes: 15
        run: |
          test_binary=./bin/Release-linux-x86_64/Crowny-Tests/Crowny-Tests
          echo "Running focused Mono tests with a 90-second deadline"
          stdbuf -oL -eL timeout --signal=TERM --kill-after=15s 90s "$test_binary" "[Mono]" --reporter console --durations yes
          echo "Running the process-isolated managed reload test with a 90-second deadline"
          stdbuf -oL -eL timeout --signal=TERM --kill-after=15s 90s "$test_binary" \
            "[.ProcessIsolated]" \
            --reporter console --durations yes
          echo "Running the full native suite with a 10-minute deadline"
          stdbuf -oL -eL timeout --signal=TERM --kill-after=15s 10m "$test_binary" --reporter console --durations yes

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check generated interop and runtime asset API boundaries
        run: |
          python Scripts/managed/generate_managed_interop.py --check
          python Scripts/check_asset_api.py --self-test

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install Mono
        shell: powershell
        run: |
          choco install mono --version $env:MONO_VERSION --yes --no-progress
          $chocoExitCode = $LASTEXITCODE
          if ($chocoExitCode -notin @(0, 1641, 3010)) { exit $chocoExitCode }
          $monoRoot = Join-Path $env:ProgramFiles "Mono"
          $requiredMonoFiles = @(
            (Join-Path $monoRoot "include\mono-2.0\mono\jit\jit.h"),
            (Join-Path $monoRoot "lib\mono-2.0-sgen.lib"),
            (Join-Path $monoRoot "bin\mono-2.0-sgen.dll")
          )
          foreach ($requiredFile in $requiredMonoFiles) {
            if (-not (Test-Path -LiteralPath $requiredFile)) { throw "Mono installation is missing $requiredFile" }
          }
          "CROWNY_MONO_ROOT=$monoRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Vulkan SDK
        shell: powershell
        run: |
          & Scripts\crowny.bat deps vulkan --version $env:VULKAN_SDK_VERSION
          $sdkPath = Join-Path $PWD ".deps\VulkanSDK"
          "VULKAN_SDK=$sdkPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$sdkPath\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Generate projects
        shell: powershell
        run: |
          $env:CROWNY_OPENAL_ROOT = Join-Path $PWD ".deps\openal"
          "CROWNY_OPENAL_ROOT=$env:CROWNY_OPENAL_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & Scripts\crowny.bat deps openal --configuration Release --simd avx2
          & Scripts\crowny.bat deps physics --configuration Release --simd avx2
          & Scripts\crowny.bat deps spirv-cross --configuration Release --vulkan-version $env:VULKAN_SDK_VERSION --simd avx2
          & Scripts\crowny.bat gen --simd avx2

      - name: Build
        run: |
          msbuild Crowny.sln /p:Configuration=Release /p:Platform=Win64 /m

      - name: Run Tests
        shell: bash
        timeout-minutes: 15
        run: |
          export PATH=$PATH:$PWD/.deps/openal/bin
          test_binary=./bin/Release-windows-x86_64/Crowny-Tests/Crowny-Tests.exe
          echo "Running the process-isolated lane, one engine instance per test"
          "$test_binary" --list-tests "[.ProcessIsolated]" --verbosity quiet > isolated-tests.txt
          while IFS= read -r isolated_test; do
            [ -z "$isolated_test" ] && continue
            echo "Running isolated test: $isolated_test"
            timeout --signal=TERM --kill-after=15s 90s "$test_binary" \
              "$isolated_test" \
              --reporter console --durations yes || exit 1
          done < isolated-tests.txt
          rm isolated-tests.txt
          echo "Running the full native suite"
          "$test_binary"
