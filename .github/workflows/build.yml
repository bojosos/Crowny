name: Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xorg-dev libgl1-mesa-dev libx11-dev libxcursor-dev uuid-dev \
            libvorbis-dev libopenal-dev libgtk-3-dev libglib2.0-dev \
            libvulkan-dev vulkan-utility-libraries-dev spirv-tools \
            mono-devel clang
          mkdir -p Crowny/Dependencies/vulkan/include/vma
          wget -O Crowny/Dependencies/vulkan/include/vma/vk_mem_alloc.h https://raw.githubusercontent.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator/master/include/vk_mem_alloc.h

      - name: Generate projects
        run: |
          chmod +x 3rdparty/premake/bin/premake5
          ./3rdparty/premake/bin/premake5 gmake2

      - name: Build Crowny
        run: make Crowny -j$(nproc) config=release_linux64 CXX=clang++

      - name: Build Crowny-Editor
        run: make Crowny-Editor -j$(nproc) config=release_linux64 CXX=clang++

      - name: Build Crowny-Sharp
        run: |
          cd Crowny-Sharp
          find ./Source -type f -name "*.cs" -print0 | xargs -0 mcs -target:library -out:CrownySharp.dll

      - name: Build Crowny-Sandbox
        run: |
          cd Crowny-Sandbox
          find ./Source -type f -name "*.cs" -print0 | xargs -0 mcs -target:exe -out:CrownySandbox.exe -reference:../Crowny-Sharp/CrownySharp.dll

      - name: Build Crowny-Tests
        run: make Crowny-Tests -j$(nproc) config=release_linux64 CXX=clang++

      - name: Run Tests
        run: ./bin/Release-linux-x86_64/Crowny-Tests/Crowny-Tests

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.1

      - name: Setup CI Environment
        run: |
          mkdir -p Crowny/Dependencies/vulkan/include/vma
          Invoke-WebRequest -Uri https://raw.githubusercontent.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator/master/include/vk_mem_alloc.h -OutFile Crowny/Dependencies/vulkan/include/vma/vk_mem_alloc.h
        shell: powershell

      - name: Install OpenAL SDK
        run: python Scripts/setup_ci_windows.py
        shell: bash

      - name: Setup Environment Variables
        shell: bash
        run: |
          echo "OPENAL_SDK=C:/OpenAL_SDK" >> $GITHUB_ENV
          # MONO_SDK is usually C:/Program Files/Mono
          echo "MONO_SDK=C:/Program Files/Mono" >> $GITHUB_ENV

      - name: Generate projects
        run: |
          3rdparty/premake/bin/premake5.exe vs2022

      - name: Build
        run: |
          msbuild Crowny.sln /p:Configuration=Release /p:Platform=Win64 /m

      - name: Run Tests
        shell: bash
        run: |
          export PATH=$PATH:/c/OpenAL_SDK/libs/Win64
          ./bin/Release-windows-x86_64/Crowny-Tests/Crowny-Tests.exe
